name: Python CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: |
          book-story make-episode examples/story.demo.json --out outputs/smoke
          test -f outputs/smoke/storyboard.json
          test -f outputs/smoke/subtitles.srt
